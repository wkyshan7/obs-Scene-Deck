HelpText="点击画面进入面板键盘操作。\n\n红框：正式输出；绿框：预监；细黄框：键盘选中。正式输出与预监为同一场景时显示红绿双框。\n\n1–9：选择本页对应画面；直接模式下同时切换正式输出。\n左右键：连续选位，越过页首或页尾自动翻页；上下键按列移动。\nEnter（默认，可修改）：激活选中场景，安全模式送入预监，直接模式切换正式输出。\n空格（默认，可修改）：使用 OBS 当前转场将预监画面上播。\n设置预览：默认未绑定，始终只改变预监；三个动作均可在设置中自定义或清空。\nPageUp / PageDown：翻页。\nEscape：退出面板键盘焦点。\n\n单击画面：选择并激活。双击不会绕过安全模式直接上播。\n设置按钮：调整行列、实时预览、切换方式、快捷键和音量显示。\n右键画面：编辑该场景的快捷键、交换本页位置、设置分组或排序。右键编辑不会切换场景。\n名称显示于画面左上角，本页编号显示于右上角。悬停可查看固定快捷键。\n\n固定快捷键接入 OBS 热键系统，遵循 OBS 的焦点策略。数字与方向键导航仅在面板本身获得焦点时生效。\n可见预览可能使采集设备或浏览器源保持运行；媒体是否播放遵循对应源在 OBS 中的设置。"
