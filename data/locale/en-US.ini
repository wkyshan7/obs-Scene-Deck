HelpText="Click a picture to focus the panel.\n\nRed frame: Program. Green frame: Preview. Thin yellow frame: keyboard selection. A scene in both Program and Preview has both colored frames.\n\n1–9: select a picture on this page. Direct mode also switches it to Program.\nLeft/right follow scene order and automatically change pages; up/down move by column.\nEnter (default, customizable): activate selected scene (Preview in safe mode; Program in direct mode).\nSpace (default, customizable): take the current OBS Preview using the configured transition.\nSet Preview is initially unbound and always changes Preview only. Customize or clear all three actions in Settings.\nPageUp / PageDown: change page.\nEscape: release keyboard focus.\n\nClick a picture: select and activate. Double click never bypasses safe mode.\nSettings: layout, live previews, switching, shortcuts and audio meters.\nRight-click a picture: edit its shortcut, swap page positions, group or reorder. Right-click editing never switches a scene.\nThe name is at the top left; the page number is at the top right. Hover to see the fixed shortcut.\n\nFixed shortcuts use OBS's hotkey system and follow OBS's focus policy. Panel navigation only works when the panel itself has focus.\nVisible previews may keep source devices/browser sources running; media playback follows each source's OBS settings."
